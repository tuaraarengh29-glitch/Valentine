<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Letter</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Envelope -->
<div id="envelope-container">
  <img src="envelope.png" id="envelope">
  <p>♡ Letter for You ♡</p>
</div>

<!-- Letter -->
<div id="letter-container">
  <div class="letter-window">

    <img src="bouquet.jpg" class="bouquet">

    <h2 class="question">Will you be my Valentine?</h2>

    <div class="buttons">
      <img src="yes.png" class="yes-btn">
      <img src="no.png" class="no-btn">
    </div>

    <video id="loveVideo" class="love-video" playsinline>
      <source src="love.mp4" type="video/mp4">
    </video>

    <p id="loveMessage" class="love-message">
     Kasaa nangna bange anga Happy Valentines Day angni ama rani ❤️<br>
      Mamingkoba ona dongpaja ia changde ia video ko nie gisik rapaibojok baita anga nangna kasaa ine muah i love you💞🎀
    </p>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
