<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Letter</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Envelope Screen -->
<div id="envelope-container">
  <img src="envelope.png" id="envelope">
  <p>♡ Letter for You ♡</p>
</div>

<!-- Letter Screen -->
<div id="letter-container">

  <div class="letter-window">

    <!-- Bouquet Image -->
    <img src="bouquet.JPG" class="bouquet">

    <!-- Question -->
    <h2 class="question">Will you be my Valentine?</h2>

    <!-- YES / NO Buttons -->
    <div class="buttons">
      <img src="yes.png" class="yes-btn">
      <img src="no.png" class="no-btn">
    </div>

    <!-- Video -->
    <video id="loveVideo" class="love-video" playsinline>
      <source src="love.mp4" type="video/mp4">
    </video>

    <!-- Message -->
    <p id="loveMessage" class="love-message">
      I really like you ❤️ <br>
      This bouquet is for you.
    </p>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
