<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ENVELOPE SCREEN -->
<div id="envelope-container">
  <img src="envelope.png" id="envelope">
  <p>♡ Letter for You ♡</p>
</div>

<!-- LETTER SCREEN -->
<div id="letter-container">

  <div class="letter-window">

    <!-- BOUQUET IMAGE (REPLACES TITLE + CAT) -->
    <img src="bouquet.JPG" id="bouquet" class="bounce">
    <h2 class="question">Will you be my Valentine?</h2>

    <div class="buttons">
      <img src="yes.png" class="btn yes-btn">
      <img src="no.png" class="btn no-btn">
    </div>

  </div>

</div>

<!-- VIDEO -->
<video id="loveVideo" class="love-video" muted playsinline>
  <source src="love.mp4" type="video/mp4">
</video>

<script src="script.js"></script>

</body>
</html>
